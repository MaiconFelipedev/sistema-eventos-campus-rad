{% extends "base.html" %}
{% block title %}Confirmar exclusão · Eventos IFPB{% endblock %}
{% block content %}
<section class="card narrow">
    <p class="eyebrow">Ação irreversível</p>
    <h1>Confirmar exclusão</h1>
    <p>Tem certeza de que deseja excluir <strong>{{ object }}</strong>?</p>
    <form method="post" class="actions">
        {% csrf_token %}
        <button class="button button-danger" type="submit">Sim, excluir</button>
        <a class="button button-secondary" href="javascript:history.back()">Cancelar</a>
    </form>
</section>
{% endblock %}
